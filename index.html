<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고사장 좌석배치 관리</title>
<style>
  :root {
    --bg: #F5F6F8;
    --surface: #FFFFFF;
    --surface-raised: #FFFFFF;
    --ink: #1B2231;
    --ink-soft: #5A6376;
    --line: #E1E4EA;
    --primary: #2C5282;
    --primary-ink: #FFFFFF;
    --primary-soft: #E9F0FA;
    --present: #2F8F5B;
    --present-bg: #E7F5EC;
    --absent: #C0524B;
    --absent-bg: #FBEBEA;
    --empty: #C7CCD6;
    --empty-bg: #F1F2F5;
    --danger: #C0524B;
    --radius: 10px;
    --font: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #14161C;
      --surface: #1C1F28;
      --surface-raised: #232733;
      --ink: #EDEFF3;
      --ink-soft: #9CA3B3;
      --line: #2C3140;
      --primary: #5B8FCC;
      --primary-ink: #10131A;
      --primary-soft: #1F2D42;
      --present: #4CAE7C;
      --present-bg: #17301F;
      --absent: #D9776E;
      --absent-bg: #34201E;
      --empty: #454B5C;
      --empty-bg: #21242D;
      --danger: #D9776E;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161C;
    --surface: #1C1F28;
    --surface-raised: #232733;
    --ink: #EDEFF3;
    --ink-soft: #9CA3B3;
    --line: #2C3140;
    --primary: #5B8FCC;
    --primary-ink: #10131A;
    --primary-soft: #1F2D42;
    --present: #4CAE7C;
    --present-bg: #17301F;
    --absent: #D9776E;
    --absent-bg: #34201E;
    --empty: #454B5C;
    --empty-bg: #21242D;
    --danger: #D9776E;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }

  /* ---------- 로그인 화면 ---------- */
  .login-screen {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 36px 28px 30px;
  }
  .login-kicker {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 6px;
  }
  .login-title {
    font-size: 21px;
    font-weight: 700;
    margin: 0 0 28px;
    line-height: 1.4;
  }
  .field-label {
    font-size: 13px;
    color: var(--ink-soft);
    display: block;
    margin-bottom: 8px;
  }
  .phone-input {
    width: 100%;
    font-size: 24px;
    letter-spacing: 6px;
    text-align: center;
    padding: 14px 10px;
    border-radius: var(--radius);
    border: 1.5px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    outline: none;
    transition: border-color .15s ease;
  }
  .phone-input:focus { border-color: var(--primary); }
  .login-btn {
    width: 100%;
    margin-top: 18px;
    padding: 13px;
    border: none;
    border-radius: var(--radius);
    background: var(--primary);
    color: var(--primary-ink);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .login-btn:disabled { opacity: .5; cursor: not-allowed; }
  .login-error {
    margin-top: 14px;
    font-size: 13px;
    color: var(--danger);
    min-height: 18px;
  }
  .login-note {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  /* ---------- 대시보드 ---------- */
  .app { display: none; min-height: 100%; flex-direction: column; }
  .app.active { display: flex; }

  .topbar {
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    padding-bottom: 14px;
    padding-left: 20px;
    padding-right: 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar-venue { font-size: 16px; font-weight: 700; }
  .topbar-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .topbar-right { display: flex; align-items: center; gap: 14px; }
  .logout-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  .logout-btn:hover { color: var(--ink); }

  .summary-bar {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    overflow-x: auto;
  }
  .summary-chip {
    flex: none;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 16px;
    min-width: 84px;
  }
  .summary-chip .num { font-size: 20px; font-weight: 700; line-height: 1.2; }
  .summary-chip .label { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .summary-chip.present .num { color: var(--present); }
  .summary-chip.absent .num { color: var(--absent); }

  .room-overview {
    margin: 0 20px 40px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    max-height: 78vh;
    overflow-y: auto;
  }
  .room-overview-head {
    position: sticky;
    top: 0;
    display: grid;
    grid-template-columns: 2fr 0.8fr 0.8fr 0.8fr 1fr;
    gap: 8px;
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .room-overview-row {
    display: grid;
    grid-template-columns: 2fr 0.8fr 0.8fr 0.8fr 1fr;
    gap: 8px;
    align-items: center;
    padding: 14px 20px;
    font-size: 17px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .room-overview-row:last-child { border-bottom: none; }
  .room-overview-row:hover { background: var(--primary-soft); }
  .room-overview-row.active { background: var(--primary-soft); font-weight: 600; }
  .room-overview-row.done { background: var(--present-bg); }
  .room-overview-row .rname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .room-overview-row .rnum { text-align: center; font-weight: 700; }
  .room-overview-row .rnum.present { color: var(--present); }
  .room-overview-row .rnum.absent { color: var(--absent); }
  .room-overview-row .rdone { text-align: center; color: var(--present); font-weight: 700; font-size: 14px; }
  .room-overview-row .rdone.no { color: var(--ink-soft); font-weight: 500; }

  .view-tabs {
    display: flex;
    gap: 6px;
    padding: 0 20px 14px;
  }
  .view-tab {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    font-size: 13.5px;
    cursor: pointer;
  }
  .view-tab.active {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--primary-ink);
    font-weight: 600;
  }

  .review-panel {
    margin: 0 20px 40px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    overflow: hidden;
  }
  .review-head {
    display: grid;
    grid-template-columns: 1.3fr 1.3fr 0.8fr 0.9fr;
    gap: 4px;
    padding: 9px 14px;
    font-size: 11.5px;
    color: var(--ink-soft);
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
  }
  .review-body { max-height: 60vh; overflow-y: auto; }
  .review-row {
    display: grid;
    grid-template-columns: 1.3fr 1.3fr 0.8fr 0.9fr;
    gap: 4px;
    padding: 8px 14px;
    font-size: 13.5px;
    border-bottom: 1px solid var(--line);
    align-items: center;
  }
  .review-row:last-child { border-bottom: none; }
  .review-row .exam-status { font-weight: 600; }
  .review-row.present .exam-status { color: var(--present); }
  .review-row.absent .exam-status { color: var(--absent); }
  .review-row.pending { background: var(--absent-bg); }
  .review-row.pending .exam-status { color: var(--absent); }
  .review-reg { font-size: 12px; color: var(--ink-soft); }
  .review-reg.done { color: var(--present); font-weight: 600; }
  .review-empty {
    padding: 30px 14px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
  }

  .room-tabs {
    display: flex;
    gap: 8px;
    padding: 0 20px 14px;
    overflow-x: auto;
  }
  .room-tab {
    flex: none;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    font-size: 13.5px;
    cursor: pointer;
    white-space: nowrap;
  }
  .room-tab.active {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--primary-ink);
    font-weight: 600;
  }

  .room-panel { padding: 4px 20px 40px; }
  .room-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .room-head h2 { font-size: 15px; margin: 0; }
  .room-head .room-count { font-size: 12.5px; color: var(--ink-soft); }
  .room-head-right { display: flex; align-items: center; gap: 10px; margin-left: auto; }

  .submit-btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--present);
    background: var(--present-bg);
    color: var(--present);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .submit-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
  }
  .submit-btn.done {
    background: var(--present);
    color: var(--primary-ink);
    border-color: var(--present);
  }
  .submit-warning {
    font-size: 11.5px;
    color: var(--absent);
  }
  .done-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11.5px;
    color: var(--present);
    font-weight: 600;
  }

  .seat-grid {
    display: grid;
    gap: 10px;
    max-width: 720px;
  }
  .seat {
    aspect-ratio: 1 / 0.82;
    min-height: 64px;
    border-radius: 10px;
    border: 2px solid var(--line);
    background: var(--empty-bg);
    color: var(--ink-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    padding: 6px 4px;
    transition: transform .08s ease;
  }
  .seat:active { transform: scale(0.95); }
  .seat .seat-no { font-size: 13px; opacity: .7; }
  .seat .seat-exam { font-size: 17px; font-weight: 700; margin-top: 3px; }
  .seat .seat-status-label { font-size: 13px; font-weight: 600; margin-top: 2px; }
  .seat.state-empty { cursor: default; opacity: .55; }
  .seat.state-present { background: var(--present-bg); border-color: var(--present); color: var(--present); }
  .seat.state-absent { background: var(--absent-bg); border-color: var(--absent); color: var(--absent); }

  .legend { display: flex; gap: 16px; margin-top: 18px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); }
  .legend-dot { width: 11px; height: 11px; border-radius: 3px; border: 1.5px solid var(--line); }
  .legend-dot.present { background: var(--present-bg); border-color: var(--present); }
  .legend-dot.absent { background: var(--absent-bg); border-color: var(--absent); }
  .legend-dot.empty { background: var(--empty-bg); }

  .demo-badge {
    position: fixed;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    right: 14px;
    background: var(--surface-raised);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    font-size: 11px;
    padding: 6px 10px;
    border-radius: 8px;
    z-index: 20;
  }
</style>
</head>
<body>

<!-- ============ 로그인 화면 ============ -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <p class="login-kicker">고사장 좌석배치 관리</p>
    <h1 class="login-title">전화번호 뒷자리 4자리를<br>입력해 주세요</h1>

    <label class="field-label" for="phoneInput">휴대전화 뒷자리 4자리</label>
    <input
      id="phoneInput"
      class="phone-input"
      type="tel"
      inputmode="numeric"
      maxlength="4"
      placeholder="0000"
      autocomplete="off"
    >
    <button class="login-btn" id="loginBtn">확인</button>
    <p class="login-error" id="loginError"></p>

    <p class="login-note">
      본부감독으로 등록된 전화번호 뒷자리를 입력하면 담당 고사장 좌석배치도로 바로 이동합니다.
      번호를 확인할 수 없는 경우 자격운영팀으로 문의해 주세요.
    </p>
  </div>
</div>

<!-- ============ 대시보드 ============ -->
<div class="app" id="app">
  <div class="topbar">
    <div>
      <div class="topbar-venue" id="venueTitle">-</div>
      <div class="topbar-sub" id="supervisorLine">-</div>
    </div>
    <div class="topbar-right">
      <button class="logout-btn" id="logoutBtn">로그아웃</button>
    </div>
  </div>

  <div class="summary-bar" id="summaryBar"></div>

  <div class="view-tabs">
    <button class="view-tab active" id="viewTabInput">좌석입력</button>
    <button class="view-tab" id="viewTabRooms">고사실별 현황</button>
    <button class="view-tab" id="viewTabReview">전체 확인</button>
  </div>

  <div id="inputView">
    <div class="room-tabs" id="roomTabs"></div>
    <div class="room-panel" id="roomPanel"></div>
  </div>

  <div id="roomsView" style="display: none;">
    <div class="room-overview" id="roomOverview"></div>
  </div>

  <div id="reviewView" style="display: none;">
    <div class="review-panel" id="reviewPanel"></div>
  </div>
</div>

<div class="demo-badge">GAS 백엔드 연동됨 (실시간 저장)</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzBMuKqToa5asHDhg77r1FMl5zF_1u7wYu8SWtc6X8NXY0e6KMP51xuBHzO-rl3Ua7GsQ/exec";

/* =====================================================================
   앱 로직
   ===================================================================== */

const STORAGE_KEY = "seatapp_session_v1";
let session = null;   // { phone, name, venue }
let currentRoomIndex = 0;
let viewMode = "input"; // "input" | "review"
let roomStates = {};  // venueName -> [ {no, examNo, status}, ... ] (고사실별로 room.name 키로 저장)

async function findSupervisor(phoneLast4) {
  const res = await fetch(`${GAS_URL}?action=login&phone=${encodeURIComponent(phoneLast4)}`);
  if (!res.ok) throw new Error("network");
  const data = await res.json();
  return data.found ? data : null; // { found, name, venue, rooms }
}

async function syncSeatStatus(venue, roomLabel, seat) {
  try {
    await fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" }, // CORS preflight 회피
      body: JSON.stringify({ type: "seat", venue, roomName: roomLabel, seatNo: seat.no, status: seat.status })
    });
  } catch (e) {
    console.error("좌석 상태 저장 실패", e);
  }
}

async function syncRoomCompleted(venue, roomLabel, completed) {
  try {
    await fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ type: "room", venue, roomName: roomLabel, completed })
    });
  } catch (e) {
    console.error("고사실 등록상태 저장 실패", e);
  }
}

function loadSession() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    return null;
  }
}

function saveSession(s) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ phone: s.phone }));
  } catch (e) { /* storage 사용 불가 시 무시 */ }
}

function clearSession() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}

function enterApp(sup) {
  session = sup;
  saveSession(sup);
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").classList.add("active");
  document.getElementById("venueTitle").textContent = sup.venue;
  document.getElementById("supervisorLine").textContent = sup.name + " 감독관으로 접속됨";
  currentRoomIndex = 0;
  setViewMode("input");
  renderRoomTabs();
  renderRoom();
  renderSummary();
  renderRoomOverview();
}

function setViewMode(mode) {
  viewMode = mode;
  document.getElementById("inputView").style.display = mode === "input" ? "" : "none";
  document.getElementById("roomsView").style.display = mode === "rooms" ? "" : "none";
  document.getElementById("reviewView").style.display = mode === "review" ? "" : "none";
  document.getElementById("viewTabInput").classList.toggle("active", mode === "input");
  document.getElementById("viewTabRooms").classList.toggle("active", mode === "rooms");
  document.getElementById("viewTabReview").classList.toggle("active", mode === "review");
  if (mode === "rooms") renderRoomOverview();
  if (mode === "review") renderReviewTable();
}

function renderReviewTable() {
  const rooms = getRooms();
  const wrap = document.getElementById("reviewPanel");

  const entries = [];
  rooms.forEach(room => {
    room.seats.forEach(seat => {
      if (seat.status === "empty") return;
      entries.push({ examNo: seat.examNo, room: room.name, status: effectiveStatus(seat), completed: room.completed });
    });
  });

  if (entries.length === 0) {
    wrap.innerHTML = `<div class="review-empty">확인할 응시대상이 없습니다.</div>`;
    return;
  }

  const statusText = { present: "응시", absent: "결시" };
  let rowsHtml = "";
  entries.forEach(e => {
    rowsHtml += `
      <div class="review-row ${e.status}">
        <span>${e.examNo}</span>
        <span>${e.room}</span>
        <span class="exam-status">${statusText[e.status]}</span>
        <span class="review-reg${e.completed ? " done" : ""}">${e.completed ? "등록완료" : "미등록"}</span>
      </div>
    `;
  });

  wrap.innerHTML = `
    <div class="review-head">
      <span>수험번호</span><span>고사실</span><span>응결시</span><span>등록상태</span>
    </div>
    <div class="review-body">${rowsHtml}</div>
  `;
}

function exitApp() {
  session = null;
  clearSession();
  document.getElementById("app").classList.remove("active");
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("phoneInput").value = "";
  document.getElementById("loginError").textContent = "";
  document.getElementById("phoneInput").focus();
}

function getRooms() {
  return (session && session.rooms) ? session.rooms : [];
}

function renderRoomTabs() {
  const rooms = getRooms();
  const wrap = document.getElementById("roomTabs");
  wrap.innerHTML = "";
  rooms.forEach((room, idx) => {
    const btn = document.createElement("button");
    btn.className = "room-tab" + (idx === currentRoomIndex ? " active" : "");
    btn.textContent = room.name;
    btn.onclick = () => { currentRoomIndex = idx; renderRoomTabs(); renderRoom(); renderRoomOverview(); };
    wrap.appendChild(btn);
  });
}

// 아직 손대지 않은 좌석(pending)은 기본적으로 "응시"로 간주합니다.
// 감독관은 실제로 결시한 소수만 클릭해서 표시하면 됩니다.
function effectiveStatus(seat) {
  return seat.status === "pending" ? "present" : seat.status;
}

function toggleStatus(seat) {
  seat.status = effectiveStatus(seat) === "present" ? "absent" : "present";
}

function statusLabel(status) {
  if (status === "present") return "응시";
  if (status === "absent") return "결시";
  if (status === "empty") return "";
  return "";
}

function renderRoom() {
  const rooms = getRooms();
  const room = rooms[currentRoomIndex];
  const panel = document.getElementById("roomPanel");
  if (!room) { panel.innerHTML = ""; return; }

  const filledCount = room.seats.filter(s => s.status !== "empty").length;

  const submitHtml = room.completed
    ? `<span class="done-badge">&#10003; 등록완료</span><button class="submit-btn done" id="submitBtn">등록 취소</button>`
    : `<button class="submit-btn" id="submitBtn">고사실 등록완료</button>`;

  panel.innerHTML = `
    <div class="room-head">
      <div>
        <h2>${room.name}</h2>
        <span class="room-count">응시대상 ${filledCount}명 / 좌석 ${room.seats.length}석</span>
      </div>
      <div class="room-head-right">${submitHtml}</div>
    </div>
    <div class="seat-grid" id="seatGrid" style="grid-template-columns: repeat(${room.cols}, 1fr); grid-template-rows: repeat(${room.rows}, 1fr); grid-auto-flow: column;"></div>
    <div class="legend">
      <div class="legend-item"><span class="legend-dot present"></span>응시</div>
      <div class="legend-item"><span class="legend-dot absent"></span>결시</div>
      <div class="legend-item"><span class="legend-dot empty"></span>빈자리</div>
    </div>
  `;

  document.getElementById("submitBtn").onclick = () => {
    if (!room.completed) {
      // 아직 손 안 댄(pending) 좌석은 이 시점에 전부 "응시"로 확정해서 서버에도 반영
      room.seats.forEach(seat => {
        if (seat.status === "pending") {
          seat.status = "present";
          syncSeatStatus(session.venue, room.room, seat);
        }
      });
    }
    room.completed = !room.completed;
    renderRoom();
    renderRoomOverview();
    syncRoomCompleted(session.venue, room.room, room.completed);
  };

  const grid = document.getElementById("seatGrid");
  room.seats.forEach((seat, i) => {
    const disp = effectiveStatus(seat);
    const el = document.createElement("div");
    el.className = "seat state-" + disp;
    el.innerHTML = `
      <span class="seat-no">${seat.no}</span>
      <span class="seat-exam">${seat.examNo ? seat.examNo.slice(-4) : "빈자리"}</span>
      <span class="seat-status-label">${statusLabel(disp)}</span>
    `;
    if (disp !== "empty" && !room.completed) {
      el.onclick = () => {
        toggleStatus(seat);
        renderRoom();
        renderSummary();
        renderRoomOverview();
        syncSeatStatus(session.venue, room.room, seat);
      };
    } else if (room.completed) {
      el.style.cursor = "default";
    }
    grid.appendChild(el);
  });
}

function renderRoomOverview() {
  const rooms = getRooms();
  const wrap = document.getElementById("roomOverview");

  let html = `
    <div class="room-overview-head">
      <span>고사실</span><span class="rnum">정원</span><span class="rnum">응시</span><span class="rnum">결시</span><span class="rnum">등록상태</span>
    </div>
  `;

  rooms.forEach((room, idx) => {
    let present = 0, absent = 0, capacity = 0;
    room.seats.forEach(s => {
      if (s.status === "empty") return;
      capacity++;
      if (effectiveStatus(s) === "absent") absent++;
      else present++;
    });
    html += `
      <div class="room-overview-row${idx === currentRoomIndex ? " active" : ""}${room.completed ? " done" : ""}" data-idx="${idx}">
        <span class="rname">${room.name}</span>
        <span class="rnum">${capacity}</span>
        <span class="rnum present">${present}</span>
        <span class="rnum absent">${absent}</span>
        <span class="rdone${room.completed ? "" : " no"}">${room.completed ? "완료" : "미완료"}</span>
      </div>
    `;
  });

  wrap.innerHTML = html;
  wrap.querySelectorAll(".room-overview-row").forEach(row => {
    row.onclick = () => {
      currentRoomIndex = parseInt(row.dataset.idx, 10);
      setViewMode("input");
      renderRoomTabs();
      renderRoom();
      renderRoomOverview();
    };
  });
}

function renderSummary() {
  const rooms = getRooms();
  let total = 0, present = 0, absent = 0;
  rooms.forEach(r => r.seats.forEach(s => {
    if (s.status === "empty") return;
    total++;
    if (effectiveStatus(s) === "absent") absent++;
    else present++;
  }));
  const doneRooms = rooms.filter(r => r.completed).length;

  const bar = document.getElementById("summaryBar");
  bar.innerHTML = `
    <div class="summary-chip"><div class="num">${total}</div><div class="label">전체 응시대상</div></div>
    <div class="summary-chip present"><div class="num">${present}</div><div class="label">응시</div></div>
    <div class="summary-chip absent"><div class="num">${absent}</div><div class="label">결시</div></div>
    <div class="summary-chip present"><div class="num">${doneRooms}/${rooms.length}</div><div class="label">고사실 등록완료</div></div>
  `;
}

/* ---------- 이벤트 바인딩 ---------- */

const phoneInput = document.getElementById("phoneInput");
const loginBtn = document.getElementById("loginBtn");
const loginError = document.getElementById("loginError");

phoneInput.addEventListener("input", () => {
  phoneInput.value = phoneInput.value.replace(/\D/g, "").slice(0, 4);
  loginError.textContent = "";
});

phoneInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") attemptLogin();
});

loginBtn.addEventListener("click", attemptLogin);
document.getElementById("logoutBtn").addEventListener("click", exitApp);
document.getElementById("viewTabInput").addEventListener("click", () => setViewMode("input"));
document.getElementById("viewTabRooms").addEventListener("click", () => setViewMode("rooms"));
document.getElementById("viewTabReview").addEventListener("click", () => setViewMode("review"));

let failCount = 0;

async function attemptLogin() {
  const val = phoneInput.value.trim();
  if (val.length !== 4) {
    loginError.textContent = "4자리 숫자를 입력해 주세요.";
    return;
  }
  if (failCount >= 5) {
    loginError.textContent = "시도 횟수를 초과했습니다. 자격운영팀으로 문의해 주세요.";
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "확인 중...";
  loginError.textContent = "";

  try {
    const sup = await findSupervisor(val);
    if (!sup) {
      failCount++;
      loginError.textContent = "등록되지 않은 번호입니다. 다시 확인해 주세요.";
      return;
    }
    sup.phone = val;
    enterApp(sup);
  } catch (e) {
    loginError.textContent = "서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.";
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "확인";
  }
}

/* ---------- 시작 시 세션 복원 (같은 기기 새로고침 시 재로그인 방지) ---------- */
(async function init() {
  const saved = loadSession();
  if (saved && saved.phone) {
    try {
      const sup = await findSupervisor(saved.phone);
      if (sup) {
        sup.phone = saved.phone;
        enterApp(sup);
        return;
      }
    } catch (e) { /* 조회 실패 시 로그인 화면으로 */ }
  }
  document.getElementById("phoneInput").focus();
})();
