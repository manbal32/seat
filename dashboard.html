<!DOCTYPE html>
<!-- make_site 1.0 · 2026-10-02 10:19 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빅분기+최종테스트_후하 · 고사장 통합 현황판</title>
<style>
  :root {
    --bg: #F5F6F8; --surface: #FFFFFF; --ink: #1B2231; --ink-soft: #5A6376; --ink-faint: #8A92A3;
    --line: #E1E4EA; --primary: #2C5282; --primary-ink: #FFFFFF; --primary-soft: #E9F0FA;
    --ok: #2F8F5B; --ok-bg: #E7F5EC; --warn: #9A6A12; --warn-bg: #FBF1DC; --bad: #C0524B; --bad-bg: #FBEBEA;
    --font: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161C; --surface: #1C1F28; --ink: #EDEFF3; --ink-soft: #9CA3B3; --ink-faint: #7A8294;
      --line: #2C3140; --primary: #5B8FCC; --primary-ink: #10131A; --primary-soft: #1F2D42;
      --ok: #4CAE7C; --ok-bg: #17301F; --warn: #E0B050; --warn-bg: #33290F; --bad: #D9776E; --bad-bg: #34201E;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  .page { max-width: 1180px; margin: 0 auto; padding: 18px 24px 70px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .head h1 { font-size: 19px; margin: 0; }
  .exam-chip { display: inline-block; background: var(--primary-soft); color: var(--primary); border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 600; margin-left: 8px; vertical-align: 2px; }
  .head .sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; }
  .badge-int { display: inline-block; margin-top: 8px; font-size: 11px; color: var(--ink-soft); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
  .tools { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-soft); }
  button { font-family: inherit; cursor: pointer; }
  .btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 8px 14px; font-size: 13px; }
  .btn:hover { background: var(--primary-soft); }
  .btn:disabled { cursor: not-allowed; }

  .dl-bar { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 8px 0 10px; }
  .dl-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .dl-msg { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-faint); flex: none; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  .dl-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .dl-btn { border: 1px solid var(--primary); background: var(--primary); color: var(--primary-ink); border-radius: 8px; padding: 9px 16px; font-size: 13.5px; font-weight: 600; }
  .dl-btn.off { background: var(--surface); color: var(--ink-faint); border-color: var(--line); font-weight: 500; }
  .dl-btn:disabled { opacity: .6; cursor: progress; }
  .dl-sub { margin-top: 9px; font-size: 12.5px; color: var(--ink-soft); min-height: 18px; }
  .dl-sub a { color: var(--primary); cursor: pointer; text-decoration: underline; }

  .sum-cards { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }
  .sum-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 22px; min-width: 128px; }
  .sum-card .num { font-size: 24px; font-weight: 700; line-height: 1.2; }
  .sum-card .label { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; }
  .sum-card.ok .num { color: var(--ok); }
  .sum-card.bad .num { color: var(--bad); }
  .filters { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .filters input[type=text] { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 10px; font-size: 13px; width: 190px; }

  .tbl-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 10px 8px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { background: var(--bg); color: var(--ink-soft); font-weight: 500; }
  th:first-child, td:first-child { text-align: left; padding-left: 16px; }
  tbody tr.v { cursor: pointer; }
  tbody tr.v:hover td { background: var(--primary-soft); }
  tbody tr:last-child td { border-bottom: none; }
  .chev { display: inline-block; width: 14px; color: var(--ink-faint); transition: transform .12s; }
  tr.v.op .chev { transform: rotate(90deg); }
  .n-ok { color: var(--ok); font-weight: 600; } .n-bad { color: var(--bad); font-weight: 600; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 6px; font-size: 12.5px; font-weight: 600; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.wait { background: var(--bg); color: var(--ink-soft); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  tr.detail > td { text-align: left; background: var(--bg); padding: 10px 16px 14px 36px; white-space: normal; }
  .rooms-t { width: auto; min-width: 520px; font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .rooms-t th, .rooms-t td { padding: 6px 12px; text-align: center; background: var(--surface); }
  .rooms-t th { background: var(--bg); }
  .rooms-t th:first-child, .rooms-t td:first-child { padding-left: 12px; text-align: left; }
  .note { color: var(--ink-soft); font-size: 13px; }
  .empty { padding: 36px; text-align: center; color: var(--ink-soft); }
  .verbadge { position: fixed; right: 14px; bottom: 14px; font-size: 11px; color: var(--ink-soft); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; z-index: 20; }
  .verbadge.bad { color: var(--bad); border-color: var(--bad); }
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <div>
      <h1>고사장 통합 현황판 <span class="exam-chip">빅분기+최종테스트_후하</span></h1>
      <div class="sub">고사장별 등록 진행 상황을 확인하고, 모두 끝나면 취합 엑셀을 받습니다</div>
      <span class="badge-int">자격운영팀 내부용 · 감독관에게 배포하지 마세요</span>
    </div>
    <div class="tools">
      <label><input type="checkbox" id="auto"> 1분마다 자동 새로고침</label>
      <span id="stamp"></span>
      <button class="btn" id="refresh">새로고침</button>
    </div>
  </div>

  <div class="dl-bar">
    <div class="dl-card">
      <div class="dl-msg"><span class="dot" id="dlDot"></span><span id="dlMsg">불러오는 중…</span></div>
      <div class="dl-btns">
        <button class="dl-btn off" id="dlRooms">고사실별 취합 전체 엑셀 다운로드</button>
        <button class="dl-btn off" id="dlAtt">응결시 취합 전체 엑셀 다운로드</button>
      </div>
      <div class="dl-sub" id="dlSub"></div>
    </div>
  </div>

  <div class="sum-cards" id="summary"></div>
  <div class="tbl-wrap">
    <table>
      <colgroup><col style="width:25%"><col style="width:8%"><col style="width:10%"><col style="width:8%"><col style="width:7%"><col style="width:10%"><col style="width:16%"><col style="width:16%"></colgroup>
      <thead><tr><th>고사장</th><th>총원</th><th>고사실 완료</th><th>응시</th><th>결시</th><th>완료여부</th><th>고사실별 취합</th><th>응결시 취합</th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
</div>
<div class="verbadge" id="ver">대시보드 v21.5</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbyywnN-gFAsnccUY_mMvRcLxnvy_vvBdgGddFf8iU3Nn_stumW7WmR-ZgEZ9hjIpZcx/exec";
const EXAM_NAME = "빅분기+최종테스트_후하";
const DASH_VERSION = "v21";
const DASH_BUILD = 5;           // 같은 v21 안에서 화면만 고친 횟수 (표시용)
const XLSX_URLS = [
  "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
  "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"
];

let SUMMARY = null;          // { venues: [...] }
let SERVER_VER = null;
let openIdx = -1;
let roomCache = {};          // 고사장 이름 -> 고사실별 현황(펼칠 때 한 번만 받아옴)
let busy = false;

const $ = id => document.getElementById(id);
const esc = v => String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const fmtRoom = name => { const i = name.indexOf(" "); return i < 0 ? name : name.slice(0, i) + " · " + name.slice(i + 1); };
const num = n => Number(n).toLocaleString("ko-KR");

async function gasGet(query, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs || 60000);
  let res;
  try {
    res = await fetch(`${GAS_URL}?${query}&_=${Date.now()}`, { signal: ctrl.signal });
  } catch (e) {
    if (e && e.name === "AbortError") throw new Error(`시간 초과(${Math.round((timeoutMs || 60000) / 1000)}초 이상 응답 없음)`);
    throw new Error("요청 차단/네트워크 오류(" + (e && e.message ? e.message : e) + ")");
  } finally {
    clearTimeout(timer);
  }
  if (!res.ok) throw new Error("서버 응답 오류 HTTP " + res.status);
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); }
  catch (e) { throw new Error("JSON이 아닌 응답: " + text.replace(/\s+/g, " ").slice(0, 60)); }
  if (data && data.error === "unknown action") throw new Error("서버가 이전 버전이에요. 새 Code.gs를 배포해 주세요");
  if (data && data.error) throw new Error("서버 오류: " + data.error);
  return data;
}

/* ---------- 상태 계산 ---------- */
function statusOf(v) {
  const done = v.roomsDone === v.rooms;
  const incons = (v.inconsistentRooms || 0) > 0;     // 등록완료로 표시됐는데 서버에 미정 좌석이 남은 고사실
  const wait = ["대기", "wait"];
  return {
    done, incons,
    fin: incons ? ["확인 필요", "bad"] : (done ? ["완료", "ok"] : ["진행중", "warn"]),
    rooms: !done ? wait : (v.pending > 0 ? ["미정 " + v.pending, "bad"] : ((v.mismatchRooms === 0 && v.present + v.absent === v.registered) ? ["완료", "ok"] : ["접수 불일치", "bad"])),
    att: !done ? wait : (v.pending === 0 ? ["완료", "ok"] : ["미정 " + v.pending, "bad"])
  };
}
function readiness() {
  const vs = SUMMARY ? SUMMARY.venues : [];
  let wait = 0, bad = 0, ok = 0;
  vs.forEach(v => {
    const s = statusOf(v);
    if (s.rooms[0] === "완료" && s.att[0] === "완료") ok++;
    else if (!s.done && !s.incons) wait++;
    else bad++;
  });
  return { total: vs.length, ok, wait, bad, ready: vs.length > 0 && ok === vs.length };
}

/* ---------- 화면 ---------- */
function pill(p) { return `<span class="pill ${p[1]}">${esc(p[0])}</span>`; }

function renderDownloadBar() {
  const r = readiness();
  const dot = $("dlDot"), msg = $("dlMsg"), sub = $("dlSub");
  const b1 = $("dlRooms"), b2 = $("dlAtt");
  if (!SUMMARY) { dot.className = "dot"; msg.textContent = "불러오는 중…"; return; }
  if (r.ready) {
    dot.className = "dot ok";
    msg.textContent = `모든 고사장(${r.total}곳)이 끝났어요. 지금 받을 수 있어요.`;
    sub.textContent = "";
  } else {
    dot.className = "dot " + (r.bad ? "bad" : "warn");
    const parts = [];
    if (r.wait) parts.push(`진행 중 ${r.wait}곳`);
    if (r.bad) parts.push(`확인 필요 ${r.bad}곳`);
    msg.textContent = `아직 끝나지 않은 고사장이 ${r.total - r.ok}곳 있어요 (${parts.join(" · ")}). 모두 끝나면 다운로드가 열려요.`;
    sub.innerHTML = '급하면 <a id="forceLink">미완료 포함해서 받기</a> (한 번 더 확인해요)';
    const a = $("forceLink");
    if (a) a.onclick = () => { if (!busy) startDownload("rooms", true); };
  }
  [b1, b2].forEach(b => b.classList.toggle("off", !r.ready));
}

function renderTable() {
  const tb = $("tb");
  if (!SUMMARY) { tb.innerHTML = ""; return; }
  const vs = SUMMARY.venues;
  let html = "", shown = 0;
  vs.forEach((v, i) => {
    const s = statusOf(v);
    const open = openIdx === i;
    html += `<tr class="v${open ? " op" : ""}" data-i="${i}">
      <td><span class="chev">▸</span>${esc(v.name)}</td>
      <td>${num(v.registered)}</td>
      <td>${v.roomsDone}/${v.rooms}</td>
      <td class="n-ok">${num(v.present)}</td>
      <td class="n-bad">${num(v.absent)}</td>
      <td>${pill(s.fin)}</td>
      <td>${pill(s.rooms)}</td>
      <td>${pill(s.att)}</td></tr>`;
    shown++;
    if (open) html += `<tr class="detail"><td colspan="8" id="detail-${i}">${detailHtml(v)}</td></tr>`;
  });
  tb.innerHTML = html || `<tr><td colspan="8" class="empty">표시할 고사장이 없습니다.</td></tr>`;

  const tot = vs.reduce((a, v) => (a.reg += v.registered, a.p += v.present, a.a += v.absent, a.rd += v.roomsDone, a.rt += v.rooms, a.vd += (v.roomsDone === v.rooms ? 1 : 0), a), { reg: 0, p: 0, a: 0, rd: 0, rt: 0, vd: 0 });
  // 응시율 = 응시 ÷ 전체 응시대상(총원). 시험 중에는 아직 등록 안 한 좌석이 있어 낮게 보이다가, 고사실이 등록될수록 올라간다.
  const rateText = (p, total) => total > 0 ? (p / total * 100).toFixed(1) + "%" : "-";
  const card = (num, label, cls) => `<div class="sum-card ${cls || ""}"><div class="num">${num}</div><div class="label">${label}</div></div>`;
  $("summary").innerHTML =
    card(`${tot.vd}/${vs.length}`, "고사장 완료", vs.length && tot.vd === vs.length ? "ok" : "") +
    card(`${num(tot.rd)}/${num(tot.rt)}`, "고사실 등록완료", tot.rt && tot.rd === tot.rt ? "ok" : "") +
    card(num(tot.reg), "전체 응시대상") +
    card(num(tot.p), "응시", "ok") +
    card(num(tot.a), "결시", "bad") +
    card(rateText(tot.p, tot.reg), "응시율").replace('<div class="sum-card ', '<div title="응시 ÷ 전체 응시대상" class="sum-card ');
}

function detailHtml(v) {
  const c = roomCache[v.name];
  if (!c) return '<span class="note">고사실별 현황을 불러오는 중…</span>';
  if (c.error) return `<span class="note">불러오지 못했어요(${esc(c.error)})</span>`;
  const rows = c.rooms.map(r => {
    const sum = r.present + r.absent + r.pending;
    const mism = sum !== r.registered;
    const incons = r.completed && r.pending > 0;
    const st = r.completed ? '<span class="pill ok">완료</span>' : '<span class="pill wait">미완료</span>';
    return `<tr><td>${esc(fmtRoom(r.name))}</td><td>${r.registered}</td><td class="n-ok">${r.present}</td><td class="n-bad">${r.absent}</td><td>${r.pending}</td><td>${st}</td><td>${incons ? `<span class="n-bad">등록완료인데 미정 ${r.pending}석 — 감독관 확인 필요</span>` : (mism ? `<span class="n-bad">접수 ${r.registered} ≠ 합계 ${sum}</span>` : '<span class="note">맞음</span>')}</td></tr>`;
  }).join("");
  return `<table class="rooms-t"><thead><tr><th>고사실</th><th>접수</th><th>응시</th><th>결시</th><th>미정</th><th>등록상태</th><th>합계 확인</th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function toggleRow(i) {
  if (openIdx === i) { openIdx = -1; renderTable(); return; }
  openIdx = i;
  renderTable();
  const v = SUMMARY.venues[i];
  if (!roomCache[v.name]) {
    try {
      const d = await gasGet("action=venue_rooms&venue=" + encodeURIComponent(v.name), 60000);
      roomCache[v.name] = { rooms: d.rooms };
    } catch (e) {
      roomCache[v.name] = { error: e.message };
    }
    if (openIdx === i) { const cell = $("detail-" + i); if (cell) cell.innerHTML = detailHtml(v); }
  }
}

function setVersionBadge() {
  const el = $("ver");
  if (SERVER_VER === null) { el.textContent = `대시보드 ${DASH_VERSION}.${DASH_BUILD}`; el.classList.remove("bad"); return; }
  const same = SERVER_VER === DASH_VERSION;
  el.textContent = `대시보드 ${DASH_VERSION}.${DASH_BUILD} · 서버 ${SERVER_VER}` + (same ? "" : " (서버 재배포 필요)");
  el.classList.toggle("bad", !same);
}

/* ---------- 불러오기 ---------- */
async function load(silent) {
  if (!silent) { $("stamp").textContent = "불러오는 중…"; $("refresh").disabled = true; }
  try {
    const t0 = performance.now();
    const d = await gasGet("action=summary", 90000);
    const total = ((performance.now() - t0) / 1000).toFixed(1);
    SUMMARY = d; SERVER_VER = d.ver || "구버전";
    roomCache = {};
    const serverPart = typeof d.ms === "number" ? ` · 서버 계산 ${(d.ms / 1000).toFixed(1)}초` : "";
    $("stamp").textContent = `마지막 갱신 ${new Date().toLocaleTimeString("ko-KR")} (응답 ${total}초${serverPart})`;
    setVersionBadge();
    renderTable();
    renderDownloadBar();
    if (openIdx >= 0 && SUMMARY.venues[openIdx]) { const i = openIdx; openIdx = -1; await toggleRow(i); }
  } catch (e) {
    $("stamp").textContent = "불러오기 실패(" + e.message + ")";
    if (!SUMMARY) { $("dlMsg").textContent = "불러오지 못했어요. 새로고침을 눌러 다시 시도해 주세요."; $("dlDot").className = "dot bad"; }
  } finally {
    if (!silent) $("refresh").disabled = false;
  }
}

/* ---------- 엑셀 만들기 ---------- */
function loadXlsx() {
  if (window.XLSX) return Promise.resolve(true);
  return new Promise(resolve => {
    let i = 0;
    const next = () => {
      if (window.XLSX) return resolve(true);
      if (i >= XLSX_URLS.length) return resolve(false);
      const s = document.createElement("script");
      s.src = XLSX_URLS[i++];
      s.onload = () => resolve(!!window.XLSX);
      s.onerror = next;
      document.head.appendChild(s);
    };
    next();
  });
}

function buildRoomsAoa(rooms) {
  const open = rooms.some(r => !r.completed || r.pending > 0);
  const header = ["고사장", "고사실", "접수", "응시", "결시"].concat(open ? ["미정", "등록상태"] : []);
  const rows = rooms.map(r => {
    const base = [r.venue, fmtRoom(r.name), r.registered, r.present, r.absent];
    return open ? base.concat([r.pending, r.completed ? "완료" : "미완료"]) : base;
  });
  return [header].concat(rows);
}

function buildAttAoa(rooms) {
  const label = { p: "응시", a: "결시", n: "미정" };
  const rows = [];
  rooms.forEach(r => { const rn = fmtRoom(r.name); r.seats.forEach(s => rows.push([s[0], r.venue, rn, label[s[1]]])); });
  return [["수험번호", "고사장", "고사실", "응결시"]].concat(rows);
}

function safeName(s) { return String(s).replace(/[\\/:*?"<>|]/g, "_").trim(); }

function todayStr() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate());
}

function saveCsvFallback(aoa, filename) {
  const csv = aoa.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename.replace(/\.xlsx$/, ".csv");
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

async function startDownload(kind, force) {
  if (busy) return;
  busy = true;
  const btns = [$("dlRooms"), $("dlAtt")];
  btns.forEach(b => b.disabled = true);
  const sub = $("dlSub");
  try {
    sub.textContent = "최신 현황을 확인하는 중…";
    await load(true);                       // 눌렀을 때 기준으로 다시 확인
    const r = readiness();
    let forced = false;
    if (!r.ready) {
      if (!force) {
        if (!window.confirm(`아직 끝나지 않은 고사장이 ${r.total - r.ok}곳 있어요.\n그래도 지금 상태로 받을까요?`)) { sub.textContent = ""; return; }
      }
      if (!window.confirm(`미완료·불일치 ${r.total - r.ok}곳이 포함된 채로 받습니다.\n파일 이름에 "미완료포함"이 붙어요. 계속할까요?`)) { sub.textContent = ""; return; }
      forced = true;
    }
    sub.textContent = "서버에서 데이터를 가져오는 중… (데이터가 많으면 1분 넘게 걸릴 수 있어요)";
    const data = await gasGet(kind === "rooms" ? "action=export_rooms" : "action=export_att", 240000);
    sub.textContent = "엑셀 파일을 만드는 중…";
    const aoa = kind === "rooms" ? buildRoomsAoa(data.rooms) : buildAttAoa(data.rooms);
    const base = kind === "rooms" ? "고사실별취합" : "응결시취합";
    const filename = `${safeName(EXAM_NAME)}_${base}_${todayStr()}${forced ? "_미완료포함" : ""}.xlsx`;
    const ok = await loadXlsx();
    if (ok) {
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws["!cols"] = (kind === "rooms" ? [26, 18, 8, 8, 8, 8, 10] : [14, 26, 18, 10]).map(w => ({ wch: w }));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, kind === "rooms" ? "고사실별 취합" : "응결시 취합");
      XLSX.writeFile(wb, filename);
      sub.innerHTML = `<span style="color:var(--ok)">${esc(filename)} 파일을 내려받았어요 (${num(aoa.length - 1)}줄)</span>`;
    } else {
      saveCsvFallback(aoa, filename);
      sub.innerHTML = `<span style="color:var(--warn)">엑셀 도구를 못 불러와서 CSV로 받았어요. 엑셀에서 열면 수험번호 앞자리 0이 사라질 수 있어요.</span>`;
    }
  } catch (e) {
    sub.innerHTML = `<span style="color:var(--bad)">다운로드하지 못했어요(${esc(e.message)})</span>`;
  } finally {
    busy = false;
    btns.forEach(b => b.disabled = false);
  }
}

/* ---------- 이벤트 ---------- */
$("tb").addEventListener("click", e => {
  const tr = e.target.closest("tr.v");
  if (!tr) return;
  toggleRow(parseInt(tr.dataset.i, 10));
});
$("refresh").addEventListener("click", () => load(false));
$("dlRooms").addEventListener("click", () => startDownload("rooms", false));
$("dlAtt").addEventListener("click", () => startDownload("att", false));

let autoTimer = null;
$("auto").addEventListener("change", e => {
  clearInterval(autoTimer);
  if (e.target.checked) autoTimer = setInterval(() => { if (!busy) load(true); }, 60000);
});

setVersionBadge();
load(false);
</script>
</body>
